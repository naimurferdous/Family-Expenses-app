name: Collect DAM market prices
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 08:00 Bangladesh time
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/dam-parser.test.mjs
      - run: node scripts/collect-dam-prices.mjs
      - name: Commit Live Facts if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/livefacts/dam-prices.json
          if git diff --cached --quiet; then echo 'No price changes'; else git commit -m 'Update DAM Live Facts prices'; git push; fi
